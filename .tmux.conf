unbind C-b
set -g prefix C-.

# Required for C-. to be transmitted from the terminal through tmux to apps.
# Ghostty and Emacs (with kkp) both speak the extended key protocol.
# 'always' skips terminfo capability negotiation (tmux's terminfo entry
# for xterm-ghostty may not advertise extkeys), and the explicit pattern
# tells tmux to trust common modern terminals for extended-key support.
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'

# No delay after ESC — otherwise evil-mode in Emacs lags 500ms on every ESC.
set -sg escape-time 0

# 24-bit color so Emacs themes render correctly inside tmux.
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*256col*:RGB"

# Pass terminal focus events through to apps (Emacs auto-revert,
# modeline focus indicators, etc. need this).
set -g focus-events on

unbind C-r
bind -N "reload tmux config" C-r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf"

# Show all bindings (with notes) in a centered, scrollable popup.
# Replaces the default prefix-? which uses 'list-keys -N' inline.
unbind ?
bind -N "show all bindings in a popup" ? display-popup -E -w 90% -h 90% "tmux list-keys -N | less"

set -g mouse on

# Start window and pane numbering at 1 to match keyboard layout
# (prefix 1 jumps to first window).
set -g base-index 1
setw -g pane-base-index 1

# Auto-close numbering gaps when a window is killed
# (no more "1 3 5" after closing 2 and 4).
set -g renumber-windows on

unbind v
unbind h

unbind % # Split vertically
unbind '"' # Split horizontally

bind -N "split right (vertical pane)" | split-window -h -c "#{pane_current_path}"
bind -N "split below (horizontal pane)" - split-window -v -c "#{pane_current_path}"

bind -N "select pane left" h select-pane -L
bind -N "select pane down" n select-pane -D
bind -N "select pane up" p select-pane -U
bind -N "select pane right" l select-pane -R

bind -N "kill all other panes" o kill-pane -a
bind -N "kill current pane" k kill-pane

# ---------- Mirror Emacs window-manipulation bindings ----------
# Emacs binding              tmux mirror
#   SPC h/n/p/l (windmove)   prefix h/n/p/l                (already above)
#   SPC ,       (last buf)   prefix ,        last-pane
#   SPC .       (zoom)       prefix .        resize-pane -Z
#   SPC t t     (ace-window) prefix t t      display-panes
#   SPC t s     (swap)       prefix t s      swap-pane -D
#   SPC t k/K   (kill)       prefix t k/K    kill-pane
#   SPC t .     (flip)       prefix t .      last-pane
#   SPC t m     (move)       prefix t m      join-pane (prompt)
# Doesn't translate: t c/C (ace-copy), t u/r (winner-undo/redo).

# Direct singletons (no sub-prefix)
bind -N "last pane (Emacs s-,)" , last-pane
bind -N "zoom toggle (Emacs s-.)" . resize-pane -Z

# Emacs s-b consult-buffer feel: visual picker over windows.
bind -N "window picker (Emacs s-b)" b choose-tree -wZ

# Emacs s-s consult-line feel: enter copy-mode and start backward search.
bind -N "search scrollback (Emacs s-s)" s copy-mode \; send-keys ?

# Emacs s-y consult-yank-from-kill-ring feel: visual paste-buffer picker.
bind -N "paste-buffer picker (Emacs s-y)" y choose-buffer -Z

# Window cycling — mirrors Emacs C-{ / C-} for tab-bar prev/next.
bind -N "previous window (Emacs C-{)" '{' previous-window
bind -N "next window (Emacs C-})" '}' next-window

# 't' sub-keytable for window/pane operations
bind -N "panemap: window operations (Emacs SPC t)" t switch-client -T panemap
bind -T panemap -N "jump to pane by number (Emacs ace-window)" t display-panes
bind -T panemap -N "swap with next pane" s swap-pane -D
bind -T panemap -N "kill current pane" k kill-pane
bind -T panemap -N "kill current pane (alias)" K kill-pane
bind -T panemap -N "flip to last pane" . last-pane
bind -T panemap -N "join pane from another window" m command-prompt -p "join pane from:" "join-pane -s '%%'"
bind -T panemap -N "show panemap bindings in a popup" ? display-popup -E -w 90% -h 90% "tmux list-keys -T panemap -N | less"

set -g history-limit 100000

bind -N "rename window" r command-prompt "rename-window '%%'"
bind -N "new window in current dir" w new-window -c "#{pane_current_path}"

bind -N "enter copy-mode" [ copy-mode
bind -N "next window (Emacs ])" ] next-window


#### COLOUR (Solarized dark)

# default statusbar colors
set-option -g status-style fg=yellow,bg=black #yellow and base02

# default window title colors
set-window-option -g window-status-style fg=brightblue,bg=default #base0 and default
#set-window-option -g window-status-style dim

# active window title colors
set-window-option -g window-status-current-style fg=brightred,bg=default,bright

# pane border
set-option -g pane-border-style fg=black #base02
set-option -g pane-active-border-style fg=brightgreen #base01

# message text
set-option -g message-style fg=brightred,bg=black #orange and base01

# pane number display
set-option -g display-panes-active-colour brightred #orange
set-option -g display-panes-colour blue #blue